apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: ipsakti
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: ipsakti-client:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_URL
          value: "https://api.ipsakti.ayush.gov.in"
        - name: VITE_KEYCLOAK_URL
          value: "https://auth.ipsakti.ayush.gov.in"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: ipsakti
spec:
  selector:
    app: client
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
