apiVersion: batch/v1
kind: Job
metadata:
  name: ipsakti-db-migration
  namespace: ipsakti
  labels:
    app.kubernetes.io/name: ipsakti-db-migration
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ipsakti-db-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ipsakti-api-gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/migrate_database.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: url
