apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: ipsakti
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
      - name: ingestion
        image: ipsakti-ingestion:latest
        ports:
        - containerPort: 8002
        env:
        - name: QDRANT_URL
          value: "http://qdrant-service:6333"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch-service:9200"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: url
        - name: MINIO_ENDPOINT
          value: "http://minio-service:9000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: ipsakti
spec:
  selector:
    app: ingestion
  ports:
  - protocol: TCP
    port: 8002
    targetPort: 8002
  type: ClusterIP
