apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: ipsakti
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: orchestrator
        image: ipsakti-orchestrator:latest
        ports:
        - containerPort: 8001
        env:
        - name: QDRANT_URL
          value: "http://qdrant-service:6333"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch-service:9200"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: url
        - name: LLM_PROVIDER
          value: "self_hosted"
        - name: VLLM_URL
          value: "http://vllm-service:8000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
  namespace: ipsakti
spec:
  selector:
    app: orchestrator
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP
